[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-shopify-reconciler"
version = "0.1.0"
description = "Read-only reconciliation of prices, stock and orders between Shopify and ERPNext, with a read-only MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",  # 2.7 adds NoDecode (comma-separated lists)
  "mcp>=2.3,<3",
  # Standards-compliant GraphQL parser for the query-only guard. Minor versions follow
  # GraphQL.js and may break, so the pin stays within 3.3.x.
  "graphql-core>=3.3.1,<3.4",
]

[project.optional-dependencies]
# ruff is pinned exactly: it must match the rev in .pre-commit-config.yaml,
# otherwise the hook and CI can format the same code differently.
dev = ["pytest>=9,<10", "ruff==0.17.3", "pre-commit>=4,<5"]

[project.scripts]
reconcile = "reconciler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests
